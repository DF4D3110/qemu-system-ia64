name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: IA-64 firmware (GNU GCC)
    runs-on: ubuntu-24.04

    container:
      image: fedora:44

    defaults:
      run:
        shell: bash

    steps:
      - name: Install the IA-64 cross toolchain
        run: |
          set -euo pipefail

          dnf --assumeyes --setopt=install_weak_deps=False install \
            binutils-ia64-linux-gnu \
            coreutils \
            gcc-ia64-linux-gnu \
            git \
            gzip \
            make \
            python3 \
            tar

      - name: Check out the source tree
        uses: actions/checkout@v6

      - name: Build and validate the firmware
        run: |
          set -euo pipefail

          firmware_dir="roms/ia64-firmware"
          binary="$firmware_dir/ia64-firmware.bin"
          elf="$firmware_dir/ia64-firmware.elf"
          map="$firmware_dir/ia64-firmware.map"
          sections="$firmware_dir/ia64-firmware.sections"

          test -f "$(ia64-linux-gnu-gcc -print-libgcc-file-name)"

          make -C "$firmware_dir" clean
          make -C "$firmware_dir" -j"$(nproc)"

          test -s "$binary"
          test -s "$elf"
          test -s "$map"
          test -s "$sections"

          python3 tests/unit/test-ia64-firmware-layout.py \
            "$binary" \
            "$elf"

          ia64-linux-gnu-readelf -h "$elf" > firmware-elf-header.txt
          grep -Eiq 'Machine:.*IA-64' firmware-elf-header.txt

      - name: Package the firmware
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/qemu-system-ia64-firmware-$version"
          archive="$PWD/qemu-system-ia64-firmware.tar.gz"

          rm -rf "$dist_root" "$archive"
          mkdir -p "$dist"

          install -m 0644 \
            roms/ia64-firmware/ia64-firmware.bin \
            roms/ia64-firmware/ia64-firmware.elf \
            roms/ia64-firmware/ia64-firmware.map \
            roms/ia64-firmware/ia64-firmware.sections \
            COPYING \
            COPYING.LIB \
            LICENSE \
            README.md \
            "$dist/"

          tar -czf "$archive" \
            -C "$dist_root" \
            "$(basename "$dist")"

          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload the firmware artifact
        uses: actions/upload-artifact@v7
        with:
          path: qemu-system-ia64-firmware.tar.gz
          if-no-files-found: error
          archive: false

  linux:
    name: Linux x86-64 (GCC)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the source tree
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison \
            build-essential \
            file \
            flex \
            git \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            libsdl2-dev \
            libslirp-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            python3-wheel \
            zlib1g-dev

      - name: Configure and build the Linux emulator
        run: |
          set -euo pipefail

          rm -rf build-linux
          mkdir -p build-linux

          (
            cd build-linux
            CC=gcc CXX=g++ ../configure \
              --python=/usr/bin/python3 \
              --target-list=ia64-softmmu \
              --without-default-features \
              --enable-system \
              --enable-tcg \
              --enable-pixman \
              --enable-fdt=system \
              --enable-sdl \
              --enable-slirp \
              --enable-vnc \
              --disable-docs \
              --disable-werror
          )

          # Build only the host emulator. Firmware is built in a separate job.
          ninja -C build-linux -j"$(nproc)" qemu-system-ia64

      - name: Validate and package the Linux artifact
        run: |
          set -euo pipefail

          executable="build-linux/qemu-system-ia64"
          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/qemu-system-ia64-linux-x86_64-$version"
          archive="$PWD/qemu-system-ia64-linux-x86_64.tar.gz"

          test -x "$executable"
          test -s "$executable"

          file "$executable" > linux-file.txt
          cat linux-file.txt
          grep -Eq 'ELF 64-bit.*x86-64' linux-file.txt

          ldd "$executable" | tee linux-library-dependencies.txt
          ! grep -Fq 'not found' linux-library-dependencies.txt
          "$executable" --version

          rm -rf "$dist_root" "$archive"
          mkdir -p "$dist/share/keymaps"

          install -m 0755 "$executable" "$dist/"
          install -m 0644 \
            COPYING \
            COPYING.LIB \
            LICENSE \
            README.md \
            linux-library-dependencies.txt \
            "$dist/"

          install -m 0644 \
            pc-bios/efi-e1000.rom \
            pc-bios/vgabios-ati.bin \
            pc-bios/vgabios-stdvga.bin \
            "$dist/share/"

          install -m 0644 pc-bios/keymaps/* "$dist/share/keymaps/"

          tar -czf "$archive" \
            -C "$dist_root" \
            "$(basename "$dist")"

          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload the Linux artifact
        uses: actions/upload-artifact@v7
        with:
          path: qemu-system-ia64-linux-x86_64.tar.gz
          if-no-files-found: error
          archive: false

  windows:
    name: Windows x86-64 (MSYS2 MinGW GCC)
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out the source tree
        uses: actions/checkout@v6

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            bison
            diffutils
            findutils
            flex
            git
            grep
            make
            sed
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-dtc
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-python-wheel
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib

      - name: Configure and build the Windows emulator
        run: |
          set -euo pipefail

          rm -rf build-win64
          mkdir -p build-win64

          (
            cd build-win64
            CC=gcc CXX=g++ ../configure \
              --python=/mingw64/bin/python \
              --target-list=ia64-softmmu \
              --without-default-features \
              --enable-system \
              --enable-tcg \
              --enable-pixman \
              --enable-fdt=system \
              --enable-sdl \
              --enable-slirp \
              --enable-vnc \
              --disable-docs \
              --disable-werror
          )

          # Build only the host executables. Firmware is built in a separate job.
          ninja -C build-win64 -j"$(nproc)" \
            qemu-system-ia64.exe \
            qemu-system-ia64w.exe

      - name: Validate and stage the Windows distribution
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/qemu-system-ia64-windows-x86_64-$version"

          imported_dlls() {
            objdump -p "$1" \
              | sed -n 's/^[[:space:]]*DLL Name: //p' \
              | tr -d '\r'
          }

          is_windows_system_dll() {
            local dll="$1"
            local lower="${dll,,}"

            [[ "$lower" == api-ms-win-*.dll ||
               "$lower" == ext-ms-win-*.dll ||
               -f "/c/Windows/System32/$dll" ||
               -f "/c/Windows/SysWOW64/$dll" ]]
          }

          for executable in \
            build-win64/qemu-system-ia64.exe \
            build-win64/qemu-system-ia64w.exe; do
            test -s "$executable"
            format="$(objdump -f "$executable")"
            grep -q 'pei-x86-64' <<<"$format"
          done

          rm -rf "$dist_root"
          mkdir -p "$dist/share/keymaps"

          install -m 0755 \
            build-win64/qemu-system-ia64.exe \
            build-win64/qemu-system-ia64w.exe \
            "$dist/"

          install -m 0644 \
            COPYING \
            COPYING.LIB \
            LICENSE \
            README.md \
            "$dist/"

          install -m 0644 \
            pc-bios/efi-e1000.rom \
            pc-bios/vgabios-ati.bin \
            pc-bios/vgabios-stdvga.bin \
            "$dist/share/"

          install -m 0644 pc-bios/keymaps/* "$dist/share/keymaps/"

          # Copy MinGW runtime DLLs and their transitive dependencies.
          declare -A seen=()
          queue=(
            "$dist/qemu-system-ia64.exe"
            "$dist/qemu-system-ia64w.exe"
          )

          while (( ${#queue[@]} > 0 )); do
            pe_file="${queue[0]}"
            queue=("${queue[@]:1}")

            while IFS= read -r dll; do
              [[ -n "$dll" ]] || continue

              key="${dll,,}"
              if [[ -n "${seen[$key]+x}" ]]; then
                continue
              fi
              seen["$key"]=1

              source_dll="/mingw64/bin/$dll"
              if [[ -f "$source_dll" ]]; then
                install -m 0755 "$source_dll" "$dist/$dll"
                queue+=("$source_dll")
              elif ! is_windows_system_dll "$dll"; then
                echo "Missing runtime DLL: $dll (required by $pe_file)" >&2
                exit 1
              fi
            done < <(imported_dlls "$pe_file")
          done

          test "$(find "$dist" -maxdepth 1 -type f -iname '*.dll' | wc -l)" -gt 0

          # Run the staged executable without the MSYS2 MinGW bin directory.
          PATH="$dist:/c/Windows/System32:/c/Windows" \
            "$dist/qemu-system-ia64.exe" --version

      - name: Create the Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content -Raw VERSION).Trim()
          $source = Join-Path $PWD "dist\qemu-system-ia64-windows-x86_64-$version"
          $archive = Join-Path $PWD "qemu-system-ia64-windows-x86_64.zip"

          Remove-Item -Force $archive -ErrorAction SilentlyContinue
          Compress-Archive -LiteralPath $source -DestinationPath $archive -CompressionLevel Optimal

          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -eq 0) {
            throw "The Windows archive was not created correctly."
          }

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@v7
        with:
          path: qemu-system-ia64-windows-x86_64.zip
          if-no-files-found: error
          archive: false
