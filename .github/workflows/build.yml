name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C
  TZ: UTC

jobs:
  # Build the firmware separately from the host emulators.
  firmware:
    name: IA-64 firmware (GNU GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: fedora:44

    defaults:
      run:
        shell: bash

    steps:
      - name: Install the IA-64 cross toolchain
        run: |
          set -euo pipefail

          dnf --assumeyes --setopt=install_weak_deps=False install \
            binutils-ia64-linux-gnu \
            coreutils \
            file \
            findutils \
            gcc-ia64-linux-gnu \
            git \
            gzip \
            make \
            python3 \
            tar

      - name: Check out the source tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Build and validate the firmware
        run: |
          set -euo pipefail

          firmware_dir="roms/ia64-firmware"
          binary="$firmware_dir/ia64-firmware.bin"
          elf="$firmware_dir/ia64-firmware.elf"
          map="$firmware_dir/ia64-firmware.map"
          sections="$firmware_dir/ia64-firmware.sections"

          libgcc="$(ia64-linux-gnu-gcc -print-libgcc-file-name)"
          test -f "$libgcc"

          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Project version: '
            tr -d '\r\n' < VERSION
            printf '\n'
            printf 'libgcc: %s\n\n' "$libgcc"
            rpm -q gcc-ia64-linux-gnu binutils-ia64-linux-gnu
            printf '\n'
            ia64-linux-gnu-gcc -v
            printf '\n'
            ia64-linux-gnu-ld -v
          } > firmware-build-info.txt 2>&1

          make -C "$firmware_dir" clean
          make -C "$firmware_dir" -j"$(nproc)"

          test -s "$binary"
          test -s "$elf"
          test -s "$map"
          test -s "$sections"

          python3 tests/unit/test-ia64-firmware-layout.py \
            "$binary" \
            "$elf" \
            | tee firmware-validation.txt

          file "$elf" | tee firmware-file.txt
          ia64-linux-gnu-readelf -h "$elf" | tee firmware-elf-header.txt

          grep -Eiq 'ELF 64-bit.*(IA-64|ia64)' firmware-file.txt
          grep -Eiq 'Machine:.*IA-64' firmware-elf-header.txt

      - name: Package the firmware
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/qemu-system-ia64-firmware-$version"
          archive="$PWD/qemu-system-ia64-firmware.tar.gz"

          rm -rf "$dist_root" "$archive"
          mkdir -p "$dist"

          install -m 0644 \
            roms/ia64-firmware/ia64-firmware.bin \
            roms/ia64-firmware/ia64-firmware.elf \
            roms/ia64-firmware/ia64-firmware.map \
            roms/ia64-firmware/ia64-firmware.sections \
            "$dist/"

          install -m 0644 firmware-build-info.txt "$dist/BUILD-INFO.txt"
          install -m 0644 firmware-validation.txt "$dist/VALIDATION.txt"
          install -m 0644 firmware-file.txt "$dist/FILE.txt"
          install -m 0644 firmware-elf-header.txt "$dist/ELF-HEADER.txt"

          (
            cd "$dist"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            -C "$dist_root" \
            "$(basename "$dist")"

          gzip -t "$archive"
          tar -tzf "$archive" > firmware-archive-contents.txt
          grep -Eq '/ia64-firmware\.bin$' firmware-archive-contents.txt
          grep -Eq '/ia64-firmware\.elf$' firmware-archive-contents.txt

      - name: Upload the firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: qemu-system-ia64-firmware.tar.gz
          if-no-files-found: error
          retention-days: 30
          archive: false

  linux:
    name: Linux x86-64 (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the source tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            bison \
            build-essential \
            file \
            flex \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            libsdl2-dev \
            libslirp-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            python3-wheel \
            zlib1g-dev

      - name: Configure and build the Linux emulator
        run: |
          set -euo pipefail

          test "$(gcc -dumpmachine)" = "x86_64-linux-gnu"

          mkdir -p build-linux
          cd build-linux

          CC=gcc CXX=g++ ../configure \
            --python=/usr/bin/python3 \
            --target-list=ia64-softmmu \
            --without-default-features \
            --enable-system \
            --enable-tcg \
            --enable-pixman \
            --enable-fdt=system \
            --enable-sdl \
            --enable-slirp \
            --enable-vnc \
            --audio-drv-list=sdl \
            --disable-download \
            --disable-docs \
            --disable-guest-agent \
            --disable-modules \
            --disable-plugins \
            --disable-rust \
            --disable-tools \
            --disable-werror \
            -Doptimization=2

          # Build only the host emulator. The firmware is built in a separate job.
          ninja -j"$(nproc)" qemu-system-ia64

      - name: Validate and package the Linux artifact
        run: |
          set -euo pipefail

          executable="build-linux/qemu-system-ia64"
          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/qemu-system-ia64-linux-x86_64-$version"
          archive="$PWD/qemu-system-ia64-linux-x86_64.tar.gz"

          test -x "$executable"
          test -s "$executable"

          file "$executable" | tee linux-file.txt
          readelf -h "$executable" | tee linux-elf-header.txt
          ldd "$executable" | tee linux-dynamic-libraries.txt
          "$executable" --version | tee linux-version.txt

          grep -Eq 'ELF 64-bit.*x86-64' linux-file.txt
          grep -Eq 'Class:[[:space:]]+ELF64' linux-elf-header.txt
          grep -Eiq 'Machine:.*X86-64' linux-elf-header.txt

          if grep -Fq 'not found' linux-dynamic-libraries.txt; then
            echo "One or more Linux shared-library dependencies are unresolved." >&2
            exit 1
          fi

          rm -rf "$dist_root" "$archive"
          mkdir -p "$dist/share/keymaps"

          install -m 0755 "$executable" "$dist/"
          install -m 0644 \
            COPYING \
            COPYING.LIB \
            LICENSE \
            README.md \
            "$dist/"

          install -m 0644 \
            pc-bios/efi-e1000.rom \
            pc-bios/vgabios-ati.bin \
            pc-bios/vgabios-stdvga.bin \
            "$dist/share/"

          install -m 0644 pc-bios/keymaps/* "$dist/share/keymaps/"

          install -m 0644 linux-file.txt "$dist/FILE.txt"
          install -m 0644 linux-elf-header.txt "$dist/ELF-HEADER.txt"
          install -m 0644 linux-dynamic-libraries.txt "$dist/DYNAMIC-LIBRARIES.txt"
          install -m 0644 linux-version.txt "$dist/VERSION-OUTPUT.txt"

          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Project version: %s\n' "$version"
            printf 'Runner image: ubuntu-24.04\n'
            printf 'Compiler: '
            gcc --version | sed -n '1p'
            printf 'Linker: '
            ld --version | sed -n '1p'
          } > "$dist/BUILD-INFO.txt"

          (
            cd "$dist"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            -C "$dist_root" \
            "$(basename "$dist")"

          gzip -t "$archive"
          tar -tzf "$archive" > linux-archive-contents.txt
          grep -Eq '/qemu-system-ia64$' linux-archive-contents.txt
          grep -Eq '/SHA256SUMS$' linux-archive-contents.txt

      - name: Upload the Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: qemu-system-ia64-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload Linux build logs after a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build-logs
          path: |
            build-linux/config.log
            build-linux/meson-logs
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows x86-64 (MSYS2 MinGW GCC)
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      MSYS: winsymlinks:native

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.autocrlf input

      - name: Check out the source tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          cache: true
          path-type: minimal
          install: >-
            bison
            diffutils
            findutils
            flex
            git
            grep
            make
            sed
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-dtc
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-python-wheel
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib

      - name: Configure and build the Windows emulator
        run: |
          set -euo pipefail

          test "$(gcc -dumpmachine)" = "x86_64-w64-mingw32"
          test "$(command -v python)" = "/mingw64/bin/python"
          test "$(command -v ninja)" = "/mingw64/bin/ninja"

          mkdir -p build-win64
          cd build-win64

          CC=gcc CXX=g++ ../configure \
            --python=/mingw64/bin/python \
            --target-list=ia64-softmmu \
            --without-default-features \
            --enable-system \
            --enable-tcg \
            --enable-pixman \
            --enable-fdt=system \
            --enable-sdl \
            --enable-slirp \
            --enable-vnc \
            --audio-drv-list=sdl \
            --disable-download \
            --disable-docs \
            --disable-guest-agent \
            --disable-modules \
            --disable-plugins \
            --disable-rust \
            --disable-tools \
            --disable-werror \
            -Doptimization=2

          # Build only the host executables. The firmware is built in a separate job.
          ninja -j"$(nproc)" \
            qemu-system-ia64.exe \
            qemu-system-ia64w.exe

      - name: Validate and stage the Windows distribution
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          dist_root="$PWD/dist"
          dist="$dist_root/qemu-system-ia64-windows-x86_64-$version"

          imported_dlls() {
            objdump -p "$1" \
              | sed -n 's/^[[:space:]]*DLL Name: //p' \
              | tr -d '\r'
          }

          is_windows_system_dll() {
            local dll="$1"
            local lower="${dll,,}"

            if [[ "$lower" == api-ms-win-*.dll ||
                  "$lower" == ext-ms-win-*.dll ]]; then
              return 0
            fi

            [[ -f "/c/Windows/System32/$dll" ||
               -f "/c/Windows/SysWOW64/$dll" ]]
          }

          for executable in \
            build-win64/qemu-system-ia64.exe \
            build-win64/qemu-system-ia64w.exe; do
            test -s "$executable"

            format="$(objdump -f "$executable" \
              | awk '/file format/ { print $NF; exit }')"

            if [[ "$format" != "pei-x86-64" ]]; then
              echo "Unexpected PE format for $executable: $format" >&2
              exit 1
            fi
          done

          build-win64/qemu-system-ia64.exe --version \
            | tee windows-version.txt

          rm -rf "$dist_root"
          mkdir -p "$dist/share/keymaps" "$dist/licenses/msys2"

          install -m 0755 \
            build-win64/qemu-system-ia64.exe \
            build-win64/qemu-system-ia64w.exe \
            "$dist/"

          install -m 0644 \
            COPYING \
            COPYING.LIB \
            LICENSE \
            README.md \
            "$dist/"

          install -m 0644 \
            pc-bios/efi-e1000.rom \
            pc-bios/vgabios-ati.bin \
            pc-bios/vgabios-stdvga.bin \
            "$dist/share/"

          install -m 0644 pc-bios/keymaps/* "$dist/share/keymaps/"

          # Copy every non-system PE dependency recursively.
          declare -A visited_dlls=()
          declare -A runtime_packages=()
          queue=(
            "$dist/qemu-system-ia64.exe"
            "$dist/qemu-system-ia64w.exe"
          )

          while (( ${#queue[@]} > 0 )); do
            pe_file="${queue[0]}"
            queue=("${queue[@]:1}")

            while IFS= read -r dll; do
              [[ -n "$dll" ]] || continue

              key="${dll,,}"
              if [[ -n "${visited_dlls[$key]+x}" ]]; then
                continue
              fi
              visited_dlls["$key"]=1

              source_dll="/mingw64/bin/$dll"
              if [[ -f "$source_dll" ]]; then
                install -m 0755 "$source_dll" "$dist/$dll"
                queue+=("$source_dll")

                package="$(pacman -Qoq "$source_dll" | sed -n '1p')"
                if [[ -z "$package" ]]; then
                  echo "Could not determine the package owning $source_dll." >&2
                  exit 1
                fi
                runtime_packages["$package"]=1
                continue
              fi

              if is_windows_system_dll "$dll"; then
                continue
              fi

              echo "Unresolved PE dependency: $dll (required by $pe_file)" >&2
              exit 1
            done < <(imported_dlls "$pe_file")
          done

          dll_count="$(find "$dist" -maxdepth 1 -type f -iname '*.dll' \
            | wc -l)"
          if (( dll_count == 0 )); then
            echo "No runtime DLLs were copied into the distribution." >&2
            exit 1
          fi

          {
            for package in "${!runtime_packages[@]}"; do
              pacman -Q "$package"
            done
          } | sort > "$dist/MSYS2-RUNTIME-PACKAGES.txt"

          while IFS= read -r package; do
            while IFS= read -r license_file; do
              [[ -f "$license_file" ]] || continue

              relative="${license_file#/mingw64/share/licenses/}"
              relative="${relative#mingw64/share/licenses/}"
              install -D -m 0644 \
                "$license_file" \
                "$dist/licenses/msys2/$relative"
            done < <(
              pacman -Ql "$package" \
                | awk '$2 ~ "^/?mingw64/share/licenses/" { print $2 }'
            )
          done < <(
            printf '%s\n' "${!runtime_packages[@]}" | sort
          )

          {
            for pe_file in "$dist"/*.exe "$dist"/*.dll; do
              printf '[%s]\n' "$(basename "$pe_file")"
              imported_dlls "$pe_file" | sed 's/^/  /'
              printf '\n'
            done
          } > "$dist/PE-DEPENDENCIES.txt"

          for executable_name in \
            qemu-system-ia64.exe \
            qemu-system-ia64w.exe; do
            report="$dist/NTLDD-${executable_name%.exe}.txt"

            PATH="$dist:/c/Windows/System32:/c/Windows" \
              /mingw64/bin/ntldd.exe \
              -R \
              -D "$dist" \
              "$dist/$executable_name" \
              | tee "$report"

            if grep -Eiq 'not found' "$report"; then
              echo "ntldd found an unresolved dependency." >&2
              exit 1
            fi

            if grep -Eiq '[/\\]mingw64[/\\]bin[/\\]' "$report"; then
              echo "ntldd resolved a dependency outside the staged distribution." >&2
              exit 1
            fi
          done

          install -m 0644 windows-version.txt "$dist/VERSION-OUTPUT.txt"

          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Project version: %s\n' "$version"
            printf 'Runner image: windows-2022\n'
            printf 'MSYS2 environment: MINGW64\n'
            printf 'Compiler: '
            gcc --version | sed -n '1p'
            printf 'Linker: '
            ld --version | sed -n '1p'
            printf 'Python: '
            python --version 2>&1
          } > "$dist/BUILD-INFO.txt"

          (
            cd "$dist"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Create and verify the Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content -Raw VERSION).Trim()
          $source = Join-Path (Join-Path $PWD "dist") "qemu-system-ia64-windows-x86_64-$version"
          $archive = Join-Path $PWD "qemu-system-ia64-windows-x86_64.zip"
          $checkDirectory = Join-Path $env:RUNNER_TEMP "qemu-system-ia64-windows-archive-check"

          Remove-Item -Force $archive -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $checkDirectory -ErrorAction SilentlyContinue

          Compress-Archive -LiteralPath $source -DestinationPath $archive -CompressionLevel Optimal

          if (-not (Test-Path $archive)) {
            throw "The Windows archive was not created."
          }
          if ((Get-Item $archive).Length -le 0) {
            throw "The Windows archive is empty."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $checkDirectory

          $consoleExe = Get-ChildItem -Path $checkDirectory -Recurse -Filter "qemu-system-ia64.exe"
          $windowedExe = Get-ChildItem -Path $checkDirectory -Recurse -Filter "qemu-system-ia64w.exe"
          $runtimeDlls = Get-ChildItem -Path $checkDirectory -Recurse -Filter "*.dll"
          $checksums = Get-ChildItem -Path $checkDirectory -Recurse -Filter "SHA256SUMS"

          if (-not $consoleExe) {
            throw "qemu-system-ia64.exe is missing from the archive."
          }
          if (-not $windowedExe) {
            throw "qemu-system-ia64w.exe is missing from the archive."
          }
          if (-not $runtimeDlls) {
            throw "No runtime DLLs are present in the archive."
          }
          if (-not $checksums) {
            throw "SHA256SUMS is missing from the archive."
          }

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: qemu-system-ia64-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload Windows build logs after a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-logs
          path: |
            build-win64/config.log
            build-win64/meson-logs
          if-no-files-found: ignore
          retention-days: 14
