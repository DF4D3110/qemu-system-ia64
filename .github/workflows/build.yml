name: Build QEMU System IA64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM64 原生动态构建（只编译主程序）
          - os: windows-11-arm
            sys: clangarm64
            mode: dynamic
          # ARM64 原生静态构建（只编译主程序）
          - os: windows-11-arm
            sys: clangarm64
            mode: static
    runs-on: ${{ matrix.os }}
    env:
      dynamic_flags: '--enable-gtk'
      static_flags: '--disable-gtk --disable-spice --disable-usb-redir --disable-smartcard --disable-gnutls --disable-libssh --disable-vnc-sasl --static'
      static_extra_cflags: '-DCURL_STATICLIB -DLIBSSH_STATIC -DLIBSLIRP_STATIC -DCAIRO_WIN32_STATIC_BUILD'
      clang_extra_cflags: '-Wno-missing-prototypes -Wno-sometimes-uninitialized -Wno-pragma-pack'

    name: ${{ format('🚧 Windows {0} {1} build (qemu-system-ia64 only)', matrix.sys, matrix.mode) }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        repository: DF4D3110/qemu-system-ia64
        ref: main
        submodules: 'recursive'

    - name: 'Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          base-devel
          python
          python-setuptools
          meson
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          gcc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          python:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p
          python-distlib:p
          nsis:${{ endsWith(matrix.os, 'arm') && 'c' || 'p' }}

    - name: 'Modify pkgconfig to avoid linker issues'
      if: ${{ matrix.mode == 'static' }}
      run: |
        PKGCONFIG_FILE="/${{ matrix.sys }}/lib/pkgconfig/gpg-error.pc"
        sed -i "s#/${{ matrix.sys }}/lib/libintl.dll.a#-llibintl#g" "$PKGCONFIG_FILE"
        sed -i "s#/${{ matrix.sys }}/lib/libiconv.dll.a#-llibiconv#g" "$PKGCONFIG_FILE"

    - name: 'Verify environment'
      run: |
        python3 --version
        meson --version
        ninja --version

    - name: ${{ format('🚧 Build qemu-system-ia64 ({0})', matrix.mode) }}
      env:
        mode_flags: ${{ matrix.mode == 'dynamic' && env.dynamic_flags || env.static_flags }}
        extra_cflags: ${{ (matrix.mode == 'static' || startsWith(matrix.sys, 'clang')) && format('--extra-cflags="{0} {1}"', matrix.mode == 'static' && env.static_extra_cflags || '', startsWith(matrix.sys, 'clang') && env.clang_extra_cflags || '') || '' }}
      run: |
        ./configure --enable-sdl \
                    --enable-fdt=system \
                    --disable-docs \
                    --target-list=ia64-softmmu \
                    --prefix="$(cygpath -u '${{ github.workspace }}')/artifacts" \
                    ${{ format('{0} {1}', env.mode_flags, env.extra_cflags) }}
        ninja -C build -j$(nproc) qemu-system-ia64
        echo "version=v$(cat VERSION)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: 'Prepare artifacts (static)'
      if: ${{ matrix.mode == 'static' }}
      run: |
        mkdir -p artifacts
        cp -v build/qemu-system-ia64* artifacts/ 2>/dev/null || true

    - name: 'Prepare artifacts (dynamic)'
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
        mkdir -p artifacts
        cp -v build/qemu-system-ia64* artifacts/ 2>/dev/null || true

    - name: 'Upload artifact'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('qemu-system-ia64-{0}-{1}-{2}', env.version, matrix.sys, matrix.mode) }}
        path: ${{ github.workspace }}/artifacts/
        compression-level: 9

    - name: 'Upload logs'
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('qemu-system-ia64-{0}-{1}-{2}-logs', env.version, matrix.sys, matrix.mode) }}
        path: ${{ github.workspace }}/build
        compression-level: 9
