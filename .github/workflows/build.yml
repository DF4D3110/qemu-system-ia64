name: Build QEMU System IA64 for Windows ARM64

on:
  push:
    branches: [ main, develop ] 
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: syunnPC/qemu-system-ia64
        ref: main
        submodules: 'recursive'

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: clangarm64
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
          python
          python-setuptools
          python-pip
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          gcc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p
          python-distlib:p

    - name: Verify environment
      run: |
        clang --version
        python3 --version

    - name: Configure QEMU for Windows ARM64
      run: |
        ./configure --target-list=ia64-softmmu \
                    --enable-gtk \
                    --enable-sdl \
                    --disable-docs \
                    --cross-prefix= \
                    --extra-cflags="-target aarch64-w64-mingw32 -mcpu=neoverse-n1" \
                    --extra-ldflags="-target aarch64-w64-mingw32" \
                    --disable-werror

    - name: Build qemu-system-ia64.exe (skip firmware)
      run: |
        ninja -C build qemu-system-ia64

    - name: Upload qemu-system-ia64.exe
      uses: actions/upload-artifact@v4
      with:
        name: qemu-system-ia64-windows-arm64
        path: |
          build/qemu-system-ia64.exe
          build/qemu-system-ia64
        if-no-files-found: error
