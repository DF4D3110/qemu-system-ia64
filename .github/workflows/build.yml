name: Build QEMU System IA64 for Windows ARM64

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    name: 🚧 Windows ARM64 (dynamic build)
    runs-on: windows-11-arm64
    defaults:
      run:
        shell: msys2 {0}

    steps:
    # ============ 1. 代码签出 ============
    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        repository: DF4D3110/qemu-system-ia64
        ref: main
        submodules: 'recursive'

    # ============ 2. 环境准备 ============
    - name: 'Setup MSYS2 (clangarm64)'
      uses: msys2/setup-msys2@v2
      with:
        msystem: clangarm64
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
          python
          python-setuptools
          python-pip
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          gcc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p
          python-distlib:p

    # ============ 3. 环境验证 ============
    - name: '🔍 验证环境'
      run: |
        echo "=========================================="
        echo "🔍 环境验证"
        echo "=========================================="
        echo ""
        echo "📌 系统信息:"
        uname -a
        echo ""
        echo "📌 编译器信息:"
        clang --version 2>/dev/null || echo "⚠️  clang not found"
        echo ""
        echo "📌 Python 信息:"
        python3 --version
        echo ""
        echo "📌 Ninja 信息:"
        ninja --version 2>/dev/null || echo "⚠️  ninja not found"
        echo ""
        echo "✅ 环境验证完成"

    # ============ 4. 配置 QEMU ============
    - name: '⚙️ 配置 QEMU'
      run: |
        echo "=========================================="
        echo "⚙️ 配置 QEMU (目标: ia64-softmmu)"
        echo "=========================================="
        echo ""
        echo "📌 配置参数:"
        echo "  - 目标: ia64-softmmu"
        echo "  - 图形: GTK + SDL"
        echo "  - 文档: 已禁用"
        echo ""

        ./configure --target-list=ia64-softmmu \
                    --enable-gtk \
                    --enable-sdl \
                    --disable-docs \
                    --disable-werror 2>&1 | tee configure.log

        if [ $? -eq 0 ]; then
          echo ""
          echo "✅ 配置成功"
        else
          echo ""
          echo "❌ 配置失败"
          cat configure.log
          exit 1
        fi

    # ============ 5. 编译主程序 (跳过固件) ============
    - name: '🛠️ 编译 qemu-system-ia64.exe'
      run: |
        echo "=========================================="
        echo "🛠️ 编译 qemu-system-ia64.exe"
        echo "=========================================="
        echo ""
        echo "📌 编译目标: qemu-system-ia64"
        echo "📌 跳过: 固件 (ia64-firmware.bin)"
        echo ""

        CORES=$(nproc 2>/dev/null || echo 4)
        echo "📌 并行任务数: $CORES"
        echo ""

        ninja -C build -j$CORES qemu-system-ia64 2>&1 | tee build.log

        if [ $? -eq 0 ]; then
          echo ""
          echo "✅ 编译成功"
        else
          echo ""
          echo "❌ 编译失败"
          tail -100 build.log
          exit 1
        fi

        echo ""
        echo "📌 编译产物:"
        ls -la build/qemu-system-ia64* 2>/dev/null || echo "⚠️  未找到产物"

    # ============ 6. 准备版本信息 ============
    - name: '📦 获取版本信息'
      id: version
      run: |
        VERSION=$(cat VERSION 2>/dev/null | tr -d '\n' || echo "unknown")
        SHORT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "nogit")
        echo "version=v${VERSION}-${SHORT_HASH}" >> $GITHUB_OUTPUT
        echo "📌 版本: v${VERSION}-${SHORT_HASH}"

    # ============ 7. 上传产物 ============
    - name: '⬆️ 上传产物'
      uses: actions/upload-artifact@v4
      with:
        name: qemu-system-ia64-windows-arm64-${{ steps.version.outputs.version }}
        path: |
          build/qemu-system-ia64.exe
          build/qemu-system-ia64
        if-no-files-found: error
        compression-level: 9

    # ============ 8. 失败时上传日志 ============
    - name: '📋 上传日志 (如果失败)'
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          configure.log
          build.log
        compression-level: 9
